name: Test, build and deploy legacy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 17 * * 0"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      archive_changed: ${{ steps.source_archive.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test source sampling, static build and browser calculations
        run: |
          python -m unittest discover -s tests -v
          npm test
          node --check web/app.js
      - uses: actions/cache@v4
        with:
          path: .cache/national
          key: national-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: national-v3-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: datasets
          key: coastal-v3-${{ runner.os }}-${{ hashFiles('datasets/inventory.json') }}-${{ github.run_id }}
          restore-keys: coastal-v3-${{ runner.os }}-${{ hashFiles('datasets/inventory.json') }}-
      - uses: actions/cache@v4
        with:
          path: .cache/area-boundaries
          key: abs-boundaries-2021-gda94-v2
      - name: Refresh national beaches, stays and survey inventory
        if: github.event_name != 'pull_request'
        run: python -m scripts.acquire_national
      - name: Cache ABS boundaries for coastal map regions
        if: github.event_name != 'pull_request'
        run: python -m scripts.fetch_area_boundaries
      - name: Prepare Australia-wide broad-scale depth context
        if: github.event_name != 'pull_request'
        run: python -m scripts.fetch_national_context
      - name: Acquire missing government contours at build time
        if: github.event_name != 'pull_request'
        run: python -m scripts.fetch_missing_contours
      - name: Verify legacy hostname ownership
        run: test "$(cat CNAME)" = "old.finfolk.com.au"
      - name: Build backend-free site
        run: python -m depth_explorer build-static --output _site
      - name: Prepare active survey sources for Git LFS
        id: source_archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m scripts.archive_sources
      - name: Upload active survey source archive
        if: steps.source_archive.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: survey-sources
          path: .cache/source-archive
          include-hidden-files: true
          retention-days: 1
      - name: Upload Pages artifact with materialized LFS data
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4

  archive:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.archive_changed == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: survey-sources
          path: .cache/source-archive
      - name: Commit active public sources through Git LFS
        run: |
          git rm -r --ignore-unmatch datasets/raw datasets/processed
          cp -R .cache/source-archive/. datasets/
          git lfs install --local
          git add datasets/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive acquired government depth sources with Git LFS"
          git push origin HEAD:main
