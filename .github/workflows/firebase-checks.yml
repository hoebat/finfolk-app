name: Check FinFolk logbook access
on:
  push:
    branches: [main]
    paths: ['web/logbook*', 'web/firebase*', 'functions/**', 'firestore*', 'storage*', 'firebase.json', 'tests/test_logbook*', 'package*.json', '.github/workflows/firebase-checks.yml']
  pull_request:
    paths: ['web/logbook*', 'web/firebase*', 'functions/**', 'firestore*', 'storage*', 'firebase.json', 'tests/test_logbook*', 'package*.json', '.github/workflows/firebase-checks.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: node tests/test_logbook.mjs
      - name: Verify Firebase rules and cleanup callables
        run: npx --yes firebase-tools@15.34.2 emulators:exec --project demo-finfolk --only auth,firestore,storage,functions 'node tests/test_logbook_rules.mjs && node tests/test_logbook_functions.mjs'
