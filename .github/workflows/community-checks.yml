name: Check FinFolk community and storage
on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'docs/openapi/**', 'scripts/*neon*', 'scripts/migrate*', 'tests/**', 'package*.json', 'neon.ts', 'wrangler.jsonc', '.github/workflows/community-checks.yml']
  pull_request:
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/test_regulars.mjs && node tests/test_offline.mjs && node tests/test_account.mjs && node tests/test_posts.mjs && node tests/test_trips.mjs && node tests/test_trips_ui.mjs && node tests/test_instagram_dm.mjs && node tests/test_instagram_claim_ui.mjs && node tests/test_instagram_commands.mjs && node tests/test_instagram_commands_ui.mjs && node tests/test_messaging_api.mjs && node tests/test_messaging_settings.mjs && node tests/test_messaging_worker.mjs && node tests/test_instagram_eligibility.mjs && node tests/test_instagram_publication.mjs && node tests/test_messaging_health.mjs && node tests/test_instagram_unified.mjs
      - run: npx wrangler deploy --dry-run --outdir .cache/worker
