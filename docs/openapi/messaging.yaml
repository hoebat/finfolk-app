  /v1/admin/messaging/events:
    get:
      operationId: messagingEvents
      summary: List minimal signed-event and reply metadata
      tags:
        - Administration
      security:
        - memberJWT: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: command
          schema:
            type: string
            enum:
              - ping
              - help
              - claim
              - status
              - checkin
              - points
              - unknown
              - prompt
              - claim_usage
              - unsupported
        - in: query
          name: state
          schema:
            type: string
            enum:
              - received
              - queued
              - processing
              - completed
              - ignored
              - blocked
              - paused
              - failed
        - in: query
