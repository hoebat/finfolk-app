openapi: 3.0.3
info:
  title: FinFolk Instagram Messaging API
  version: 1.0.0
  description: >-
    Single-brand, follower-gated command bot. provider_accepted is not delivery/read confirmation.
    Profile links do not verify ownership. Member IDs are never accepted from request bodies. Legacy
    /api Instagram actions delegate to the same services. Replies are internal event-bound
    operations; no arbitrary send endpoint exists.
servers:
  - url: https://api.finfolk.com.au
tags:
  - name: Members
  - name: Administration
  - name: Provider
paths:
  /v1/me/instagram:
    get:
      operationId: instagramState
      summary: Get the current link and capabilities
      tags:
        - Members
      security:
        - memberJWT: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InstagramState'
                  requestId:
                    type: string
                    format: uuid
                required:
                  - data
                  - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    delete:
      operationId: disconnectInstagram
      summary: Remove link and cancel unsent member work
      tags:
        - Members
      security:
        - memberJWT: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]+$
          description: >-
            Same actor/key/input replays the encrypted response for 24 hours; changed input returns
            409. Use a new key after expiry.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ok'
                  requestId:
                    type: string
                    format: uuid
                required:
                  - data
                  - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
